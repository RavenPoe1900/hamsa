<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi cuenta — Electro Hogar</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  /* ---- Wrapper centrado ---- */
  .account-wrap{ max-width:1100px; margin-inline:auto; padding-bottom:60px; }
  .account-breadcrumb{ padding:22px 0 20px; }
  .account-breadcrumb .sep{ color:var(--border); }

  /* ---- Shell: sidebar + content ---- */
  .account-shell{
    display:grid;
    grid-template-columns:240px 1fr;
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    overflow:hidden;
    box-shadow:0 2px 12px -4px rgba(0,0,0,.08);
  }

  /* ---- Sidebar ---- */
  .account-nav{
    background:var(--card);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
  }
  .nav-profile{
    padding:22px 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:13px;
  }
  .nav-avatar{
    width:46px; height:46px;
    border-radius:999px;
    background:var(--accent);
    color:#fff;
    display:grid; place-items:center;
    font-family:var(--font-display);
    font-weight:800;
    font-size:17px;
    flex-shrink:0;
    letter-spacing:-.01em;
  }
  .nav-profile-name{ font-size:13.5px; font-weight:700; line-height:1.25; }
  .nav-profile-role{ font-size:11px; color:var(--muted-fg); margin-top:2px; }

  .nav-links{ flex:1; padding:8px 0; }
  .nav-link{
    display:flex; align-items:center; gap:11px;
    padding:11px 20px;
    font-size:13.5px; color:var(--muted-fg);
    transition:background .12s ease, color .12s ease;
    cursor:pointer;
  }
  .nav-link:hover{ background:var(--muted); color:var(--foreground); }
  .nav-link.is-active{ background:var(--accent-tint); color:var(--accent); font-weight:700; }
  .nav-link.is-admin{ color:var(--accent); font-weight:700; }
  .nav-link .ic{ width:17px; height:17px; flex-shrink:0; }

  .nav-footer{ padding:14px 20px; border-top:1px solid var(--border); }
  .nav-logout{
    display:flex; align-items:center; gap:10px;
    width:100%; padding:9px 0;
    background:none; border:0; cursor:pointer;
    font-size:13.5px; font-weight:600; font-family:inherit;
    color:var(--destructive);
    transition:color .12s ease;
  }
  .nav-logout:hover{ color:#B91C1C; }
  .nav-logout .ic{ width:17px; height:17px; }

  /* ---- Área de contenido ---- */
  .account-content{
    background:var(--background);
    padding:32px 36px;
    min-width:0;
  }

  /* ---- Saludo de bienvenida ---- */
  .account-welcome{
    display:flex; align-items:center; gap:20px;
    padding-bottom:28px; margin-bottom:32px;
    border-bottom:1px solid var(--border);
  }
  .welcome-avatar{
    width:64px; height:64px;
    border-radius:999px;
    background:var(--accent);
    color:#fff;
    display:grid; place-items:center;
    font-family:var(--font-display);
    font-weight:800; font-size:25px;
    flex-shrink:0;
    box-shadow:0 4px 14px -4px color-mix(in srgb, var(--accent) 55%, transparent);
  }
  .welcome-h1{
    font-size:28px; letter-spacing:-.022em;
    line-height:1.05; margin:0;
  }
  .welcome-meta{
    color:var(--muted-fg); font-size:12.5px;
    margin-top:5px;
  }

  /* ---- Títulos de sección ---- */
  .sec-title{
    font-size:11.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.07em;
    color:var(--muted-fg);
    margin:0 0 14px;
  }
  .sec-block{ margin-bottom:36px; }
  .sec-block:last-child{ margin-bottom:0; }

  /* ---- Tarjetas de dirección ---- */
  .addr-grid{ display:grid; gap:12px; margin-bottom:14px; }
  .addr-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 20px;
    box-shadow:0 1px 4px rgba(0,0,0,.05);
    transition:border-color .12s ease;
  }
  .addr-card:hover{ border-color:var(--ring); }
  .addr-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .addr-head .ic{ width:17px; height:17px; color:var(--muted-fg); flex-shrink:0; }
  .addr-label{ font-weight:700; font-size:14px; }
  .addr-default{
    display:inline-flex; align-items:center;
    padding:2px 8px; margin-left:4px;
    background:var(--accent-tint); color:var(--accent);
    border-radius:999px; font-size:10.5px; font-weight:700;
  }
  .addr-text{ font-size:13px; color:var(--muted-fg); line-height:1.55; }
  .addr-actions{ display:flex; gap:8px; margin-top:12px; }

  /* Formulario inline de edición de dirección */
  .addr-edit-form{ display:none; flex-direction:column; gap:10px; margin-top:14px; padding-top:14px; border-top:1px solid var(--border); }
  .addr-edit-form.is-open{ display:flex; }
  .addr-edit-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  /* ---- Card de datos de cuenta ---- */
  .account-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:24px;
    max-width:440px;
    box-shadow:0 1px 4px rgba(0,0,0,.05);
  }
  .account-card .field{ margin-bottom:18px; }
  .account-card .field:last-of-type{ margin-bottom:0; }
  .input-readonly{
    background:var(--muted) !important;
    color:var(--muted-fg) !important;
    cursor:not-allowed;
    border-color:var(--border) !important;
  }
  .input-readonly:focus{ box-shadow:none !important; border-color:var(--border) !important; }

  /* ---- Responsive ---- */
  @media (max-width:820px){
    .account-shell{ grid-template-columns:1fr; border-radius:var(--radius); }
    .account-nav{ border-right:0; border-bottom:1px solid var(--border); flex-direction:column; }
    .nav-links{ display:flex; flex-direction:row; overflow-x:auto; padding:4px 12px; gap:4px; -webkit-overflow-scrolling:touch; }
    .nav-link{ padding:8px 14px; border-radius:var(--radius); white-space:nowrap; }
    .nav-link.is-active{ background:var(--accent-tint); }
    .nav-footer{ border-top:1px solid var(--border); padding:12px 16px; display:flex; }
    .account-content{ padding:24px 20px; }
    .welcome-avatar{ width:50px; height:50px; font-size:19px; }
    .welcome-h1{ font-size:22px; }
    .addr-edit-row{ grid-template-columns:1fr; }
    .account-card{ max-width:100%; }
  }
  @media (max-width:500px){
    .nav-profile{ padding:16px 14px; }
    .account-content{ padding:20px 16px; }
    .account-wrap{ padding-bottom:40px; }
  }
</style>
</head>
<body>
<div data-header-mount></div>
<main id="main" class="page container">
  <div class="account-wrap">
    <nav class="breadcrumbs account-breadcrumb">
      <a href="index.html">Inicio</a><span class="sep">›</span><span>Mi cuenta</span>
    </nav>
    <div class="account-shell" data-root></div>
  </div>
</main>
<div data-footer-mount></div>
<script src="assets/products-data.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  VUI.mountChrome();
  const user = VUI.requireAuth(); if(!user) return;
  const root = document.querySelector("[data-root]");
  const esc = VUI.esc, I = VUI.icons;

  const SVG_LOGOUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>';
  const SVG_HOME  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7"/><path d="M6 10v9.5a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V10"/><path d="M10 20.5V15a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5.5"/></svg>';
  const SVG_PLUS  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" width="15" height="15"><path d="M12 5v14M5 12h14"/></svg>';
  const SVG_EDIT  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>';
  const SVG_SAVE  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>';

  function initials(name){ return (name||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
  const avatarLetters = initials(user.name);
  const firstName = esc(user.name.split(" ")[0]);
  const joinDate  = new Date(user.createdAt).toLocaleDateString("es-ES",{month:"long",year:"numeric"});
  const isAdmin   = user.role === "admin";

  root.innerHTML = `
    <!-- SIDEBAR -->
    <nav class="account-nav">
      <div class="nav-profile">
        <div class="nav-avatar" aria-hidden="true">${avatarLetters}</div>
        <div>
          <div class="nav-profile-name">${esc(user.name)}</div>
          ${isAdmin ? `<div class="nav-profile-role">Administrador</div>` : ""}
        </div>
      </div>
      <div class="nav-links">
        <a class="nav-link is-active" href="cuenta.html">${I.user}Mi cuenta</a>
        <a class="nav-link" href="pedidos.html">${I.box}Tus pedidos</a>
        <a class="nav-link" href="favoritos.html">${I.heart}Lista de favoritos</a>
        ${isAdmin ? `<a class="nav-link is-admin" href="admin/index.html">${I.shield}Administración →</a>` : ""}
      </div>
      <div class="nav-footer">
        <button class="nav-logout" data-logout>
          <span class="ic" aria-hidden="true">${SVG_LOGOUT}</span>Cerrar sesión
        </button>
      </div>
    </nav>

    <!-- CONTENIDO -->
    <div class="account-content">

      <!-- BIENVENIDA -->
      <div class="account-welcome">
        <div class="welcome-avatar" aria-hidden="true">${avatarLetters}</div>
        <div class="welcome-text">
          <h1 class="welcome-h1">Hola, ${firstName}</h1>
          <p class="welcome-meta">${esc(user.email)} · cliente desde ${joinDate}</p>
        </div>
      </div>

      <!-- DIRECCIONES -->
      <div class="sec-block">
        <p class="sec-title">Direcciones</p>
        <div class="addr-grid" data-addr-list></div>
        <button class="btn btn-outline btn-sm" data-add-addr>
          <span class="ic" aria-hidden="true">${SVG_PLUS}</span>Añadir dirección
        </button>
      </div>

      <!-- DATOS DE LA CUENTA -->
      <div class="sec-block">
        <p class="sec-title">Datos de la cuenta</p>
        <div class="account-card">
          <div class="field">
            <label for="acct-name">Nombre</label>
            <input id="acct-name" class="input" value="${esc(user.name)}" autocomplete="name">
          </div>
          <div class="field">
            <label for="acct-email">Email</label>
            <input id="acct-email" class="input input-readonly" value="${esc(user.email)}" readonly autocomplete="email" tabindex="-1">
            <span class="field hint">El email no puede modificarse directamente. Contacta con soporte si necesitas cambiarlo.</span>
          </div>
          <button class="btn btn-primary btn-sm" style="margin-top:8px;" data-save-account>
            ${SVG_SAVE} Guardar cambios
          </button>
        </div>
      </div>

    </div>`;

  /* ---- Direcciones ---- */
  function renderAddresses(){
    const box = document.querySelector("[data-addr-list]");
    if(!user.addresses.length){
      box.innerHTML = `<p style="color:var(--muted-fg);font-size:13.5px;margin-bottom:4px;">No tienes direcciones guardadas.</p>`;
      return;
    }
    box.innerHTML = user.addresses.map((a,i)=>`
      <div class="addr-card" data-addr-card="${a.id}">
        <div class="addr-head">
          <span class="ic" aria-hidden="true">${SVG_HOME}</span>
          <span class="addr-label">${esc(a.label||"Dirección")}</span>
          ${i===0?'<span class="addr-default">Predeterminada</span>':''}
        </div>
        <p class="addr-text">${esc(a.line1)}, ${esc(a.city)} ${esc(a.zip)}, ${esc(a.country)}</p>
        <div class="addr-actions">
          <button class="btn btn-outline btn-sm" data-edit-addr="${a.id}">${SVG_EDIT} Editar</button>
          <button class="btn btn-danger btn-sm" data-del-addr="${a.id}">Eliminar</button>
        </div>
        <form class="addr-edit-form" data-edit-form="${a.id}" novalidate>
          <div class="addr-edit-row">
            <div class="field" style="margin:0;"><label>Etiqueta</label><input class="input" name="label" value="${esc(a.label||"")}" placeholder="Casa, Trabajo…"></div>
            <div class="field" style="margin:0;"><label>Calle y número</label><input class="input" name="line1" value="${esc(a.line1)}" required></div>
          </div>
          <div class="addr-edit-row">
            <div class="field" style="margin:0;"><label>Ciudad</label><input class="input" name="city" value="${esc(a.city)}"></div>
            <div class="field" style="margin:0;"><label>Código postal</label><input class="input" name="zip" value="${esc(a.zip)}"></div>
          </div>
          <div class="field" style="margin:0;"><label>País</label><input class="input" name="country" value="${esc(a.country)}"></div>
          <div style="display:flex;gap:8px;margin-top:4px;">
            <button class="btn btn-primary btn-sm" type="submit">${SVG_SAVE} Guardar</button>
            <button class="btn btn-ghost btn-sm" type="button" data-cancel-edit="${a.id}">Cancelar</button>
          </div>
        </form>
      </div>`).join("");

    box.querySelectorAll("[data-del-addr]").forEach(b=>b.addEventListener("click",()=>{
      user.addresses = user.addresses.filter(a=>a.id!==b.dataset.delAddr);
      VDB.save(); renderAddresses(); VUI.toast("Dirección eliminada");
    }));

    box.querySelectorAll("[data-edit-addr]").forEach(b=>b.addEventListener("click",()=>{
      const form = box.querySelector(`[data-edit-form="${b.dataset.editAddr}"]`);
      form.classList.toggle("is-open");
      b.textContent = form.classList.contains("is-open") ? "Cancelar" : `${SVG_EDIT} Editar`;
    }));

    box.querySelectorAll("[data-cancel-edit]").forEach(b=>b.addEventListener("click",()=>{
      const form = box.querySelector(`[data-edit-form="${b.dataset.cancelEdit}"]`);
      const editBtn = box.querySelector(`[data-edit-addr="${b.dataset.cancelEdit}"]`);
      form.classList.remove("is-open");
      editBtn.innerHTML = `${SVG_EDIT} Editar`;
    }));

    box.querySelectorAll("[data-edit-form]").forEach(form=>form.addEventListener("submit",e=>{
      e.preventDefault();
      const id = form.dataset.editForm;
      const addr = user.addresses.find(a=>a.id===id);
      if(!addr) return;
      const fd = new FormData(form);
      addr.label   = fd.get("label").trim()   || addr.label;
      addr.line1   = fd.get("line1").trim()   || addr.line1;
      addr.city    = fd.get("city").trim()    || addr.city;
      addr.zip     = fd.get("zip").trim()     || addr.zip;
      addr.country = fd.get("country").trim() || addr.country;
      VDB.save(); renderAddresses(); VUI.toast("Dirección actualizada");
    }));
  }

  renderAddresses();

  document.querySelector("[data-add-addr]").addEventListener("click",()=>{
    const line1 = prompt("Dirección (calle y número):"); if(!line1) return;
    const city    = prompt("Ciudad:")           || "";
    const zip     = prompt("Código postal:")    || "";
    const country = prompt("País (ej. España):") || "España";
    const label   = prompt("Etiqueta (ej. Casa, Trabajo):")  || "Nueva dirección";
    user.addresses.push({ id:VDB.uid("addr"), label, line1, city, zip, country });
    VDB.save(); renderAddresses(); VUI.toast("Dirección añadida");
  });

  /* ---- Guardar nombre ---- */
  document.querySelector("[data-save-account]").addEventListener("click",()=>{
    const newName = document.getElementById("acct-name").value.trim();
    if(!newName){ VUI.toast("El nombre no puede estar vacío"); return; }
    user.name = newName;
    VDB.save();
    // Actualiza UI sin recargar
    document.querySelector(".nav-profile-name").textContent = newName;
    document.querySelector(".welcome-h1").textContent = "Hola, " + newName.split(" ")[0];
    VUI.toast("Nombre actualizado");
  });

  /* ---- Cerrar sesión ---- */
  document.querySelector("[data-logout]").addEventListener("click",()=>{ VDB.logout(); location.href="index.html"; });
})();
</script>
</body>
</html>
