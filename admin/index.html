<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel — Admin Electro Hogar</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/admin.css">
<script src="../assets/i18n.js"></script>
<style>
  .panel-h3{ font-size:12px; font-weight:600; margin-bottom:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted-fg); }

  .panel-hero{ display:grid; grid-template-columns:2fr 1fr; gap:16px; }
  .hero-primary{ min-height:250px; }
  .hero-label{ font-size:12px; color:var(--muted-fg); font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
  .hero-value{ font-size:34px; font-weight:800; letter-spacing:-.02em; margin:4px 0 2px; font-variant-numeric:tabular-nums; }
  .hero-sub{ font-size:12.5px; color:var(--muted-fg); margin-bottom:16px; }
  .hero-primary .bar-chart{ min-height:110px; }
  .bar-chart-wrap{ position:relative; flex:1; display:flex; flex-direction:column; }
  .chart-axis{ display:flex; gap:3px; margin-top:6px; }
  .chart-axis span{ flex:1; text-align:center; font-size:10px; color:var(--muted-fg); }
  .chart-tip{ position:absolute; transform:translate(-50%,calc(-100% - 8px)); background:var(--foreground); color:var(--background); font-size:11.5px; padding:5px 9px; border-radius:calc(var(--radius) - 2px); pointer-events:none; white-space:nowrap; top:0; left:0; opacity:0; transition:opacity .1s ease; z-index:5; font-weight:600; }
  .chart-tip.show{ opacity:1; }
  .chart-tip b{ font-weight:700; }
  .chart-tip small{ display:block; font-weight:500; opacity:.7; font-size:10px; }

  .hero-attention{ justify-content:center; }
  .attn-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 8px; margin:0 -8px; border-radius:calc(var(--radius) - 2px); color:var(--foreground); font-size:13px; }
  .attn-row:hover{ background:var(--muted); }
  .attn-count{ font-weight:700; font-variant-numeric:tabular-nums; color:var(--muted-fg); }
  .attn-count.warn{ color:var(--warning); }

  .stat-strip{ display:flex; border:1px solid var(--border); border-radius:var(--radius); background:var(--card); margin-top:16px; }
  .stat{ flex:1; padding:14px 18px; border-right:1px solid var(--border); display:flex; flex-direction:column; gap:4px; }
  .stat:last-child{ border-right:0; }
  .stat-value{ font-size:19px; font-weight:700; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .stat-label{ font-size:11.5px; color:var(--muted-fg); font-weight:500; }

  .low-stock-list{ display:flex; flex-direction:column; }
  .low-stock-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .low-stock-row:last-child{ border-bottom:0; }

  .status-bar{ display:flex; height:10px; border-radius:999px; overflow:hidden; background:var(--muted); }
  .status-bar .seg{ height:100%; }
  .status-legend{ display:flex; flex-wrap:wrap; gap:14px; margin-top:14px; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted-fg); }
  .legend-dot{ width:8px; height:8px; border-radius:999px; flex-shrink:0; }
  .legend-item b{ color:var(--foreground); font-variant-numeric:tabular-nums; font-weight:600; }

  .two-cols{ display:grid; grid-template-columns:1.5fr 1fr; gap:16px; }
  @media (max-width: 900px){
    .panel-hero{ grid-template-columns:1fr; }
    .two-cols{ grid-template-columns:1fr; }
    .stat-strip{ flex-wrap:wrap; }
    .stat{ min-width:45%; border-right:0; border-bottom:1px solid var(--border); }
  }
</style>
</head>
<body>
<script src="../assets/products-data.js"></script>
<script src="../assets/data.js"></script>
<script>if(!(window.VDB.currentUser()&&window.VDB.currentUser().role==='admin')){ location.href = window.VDB.currentUser() ? "../cuenta.html" : "../login.html?next=" + encodeURIComponent(location.pathname); }</script>
<script src="../assets/app.js"></script>
<script src="../assets/admin.js"></script>
<script>
(function(){
  const t = VI18N.t, tp = VI18N.tp;
  document.title = t("adm.dash.title");
  const content = VADMIN.mountAdmin("index.html", t("adm.nav.dashboard"), t("adm.dash.sub"));
  const s = VDB.stats();
  content.innerHTML = `
    <div class="panel-hero">
      <div class="chart-box hero-primary">
        <div class="hero-label">${t("adm.chart.sales")}</div>
        <div class="hero-value">${VUI.money(s.revenue)}</div>
        <div class="hero-sub">${tp("adm.kpi.nOrders", s.orderCount)} · ${t("adm.kpi.avgTicket").toLowerCase()} ${VUI.money(s.avgTicket)}</div>
        <div class="bar-chart-wrap" data-chart-wrap>
          <div class="bar-chart" data-chart></div>
          <div class="chart-axis" data-chart-axis></div>
          <div class="chart-tip" data-chart-tip></div>
        </div>
      </div>
      <div class="chart-box hero-attention">
        <h3 class="panel-h3">${t("adm.dash.attention")}</h3>
        <a class="attn-row" href="pedidos.html"><span>${t("adm.dash.pendingOrders")}</span><b class="attn-count ${s.pendingOrders?'warn':''}">${s.pendingOrders}</b></a>
        <a class="attn-row" href="productos.html"><span>${t("adm.chart.lowStock")}</span><b class="attn-count ${s.lowStock?'warn':''}">${s.lowStock}</b></a>
        <a class="attn-row" href="productos.html"><span>${t("card.outOfStock")}</span><b class="attn-count ${s.outOfStock?'warn':''}">${s.outOfStock}</b></a>
      </div>
    </div>
    <div class="stat-strip">
      <div class="stat"><span class="stat-value">${s.productCount}</span><span class="stat-label">${t("adm.kpi.products")}</span></div>
      <div class="stat"><span class="stat-value">${s.userCount}</span><span class="stat-label">${t("adm.kpi.customers")}</span></div>
      <div class="stat"><span class="stat-value">${VUI.money(s.inventoryValue)}</span><span class="stat-label">${t("adm.dash.inventoryValue")}</span></div>
    </div>
    <div class="two-cols" style="margin-top:16px;">
      <div class="chart-box"><h3 class="panel-h3">${t("adm.chart.lowStock")}</h3><div class="low-stock-list" data-low-stock></div></div>
      <div class="chart-box"><h3 class="panel-h3">${t("adm.dash.topProducts")}</h3><div class="low-stock-list" data-top-products></div></div>
    </div>
    <div class="chart-box" style="margin-top:16px;">
      <h3 class="panel-h3">${t("adm.dash.ordersByStatus")}</h3>
      <div class="status-bar" data-status-bar></div>
      <div class="status-legend" data-status-legend></div>
    </div>`;

  const low = VDB.db.products.filter(p=>p.stock<=5).sort((a,b)=>a.stock-b.stock).slice(0,8);
  document.querySelector("[data-low-stock]").innerHTML = low.map(p=>`<div class="low-stock-row"><div class="thumb-cell" style="${VUI.thumbStyle(p)}">${VUI.thumbImg(p)}</div><div style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${VUI.esc(p.title)}</div><span class="${p.stock===0?'stock-note out':'stock-note'}">${p.stock===0?t("card.outOfStock"):t("adm.units",{n:p.stock})}</span></div>`).join("") || `<p style="color:var(--muted-fg);font-size:13px;">${t("adm.stockHealthy")}</p>`;

  const fmtDate = iso => VI18N.fmtDate(iso+"T00:00:00",{day:"numeric",month:"short"});
  const fmtDateLong = iso => VI18N.fmtDate(iso+"T00:00:00",{weekday:"long",day:"numeric",month:"long"});
  const sales = VDB.salesByDay(30); const max = Math.max(1, ...sales.map(d=>d.total));
  document.querySelector("[data-chart-axis]").innerHTML = sales.map((d,i)=>`<span>${(i%5===0||i===sales.length-1)?fmtDate(d.date):''}</span>`).join("");
  const chartEl = document.querySelector("[data-chart]"); const chartH = chartEl.clientHeight || 110;
  chartEl.innerHTML = sales.map((d,i)=>{ const h=Math.round((d.total/max)*chartH); return `<div class="bar" ${d.total===0?'data-empty="1"':''} style="height:${Math.max(h,2)}px" data-i="${i}"></div>`; }).join("");

  const wrap = document.querySelector("[data-chart-wrap]"); const tip = document.querySelector("[data-chart-tip]");
  chartEl.querySelectorAll(".bar").forEach(bar=>{
    const d = sales[Number(bar.dataset.i)];
    bar.addEventListener("mouseenter", ()=>{
      tip.innerHTML = `<b>${VUI.money(d.total)}</b><small>${fmtDateLong(d.date)}</small>`;
      const wrapR = wrap.getBoundingClientRect(), barR = bar.getBoundingClientRect();
      tip.style.left = (barR.left - wrapR.left + barR.width/2) + "px";
      tip.style.top = (barR.top - wrapR.top) + "px";
      tip.classList.add("show");
    });
    bar.addEventListener("mouseleave", ()=> tip.classList.remove("show"));
  });

  const qtyByProduct = new Map();
  VDB.db.orders.forEach(o=>{ if(o.status==="cancelled") return; o.items.forEach(it=>{ qtyByProduct.set(it.productId, (qtyByProduct.get(it.productId)||0)+it.qty); }); });
  const topProducts = Array.from(qtyByProduct.entries()).map(([id,qty])=>({p:VDB.getProduct(id),qty})).filter(x=>x.p).sort((a,b)=>b.qty-a.qty).slice(0,8);
  document.querySelector("[data-top-products]").innerHTML = topProducts.map(({p,qty})=>`<div class="low-stock-row"><div class="thumb-cell" style="${VUI.thumbStyle(p)}">${VUI.thumbImg(p)}</div><div style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${VUI.esc(p.title)}</div><span class="stock-note ok">${t("adm.dash.unitsSold",{n:qty})}</span></div>`).join("") || `<p style="color:var(--muted-fg);font-size:13px;">${t("adm.dash.noSales")}</p>`;

  const STATUS = [
    { key:"pending", labelKey:"adm.status.pending", color:"var(--warning)" },
    { key:"paid", labelKey:"adm.status.paid", color:"var(--muted-fg)" },
    { key:"shipped", labelKey:"adm.status.shipped", color:"var(--accent)" },
    { key:"delivered", labelKey:"adm.status.delivered", color:"var(--success)" },
    { key:"cancelled", labelKey:"adm.status.cancelled", color:"var(--destructive)" },
  ];
  const totalOrders = VDB.db.orders.length || 1;
  const counts = STATUS.map(st=>({ ...st, label: t(st.labelKey), count: VDB.db.orders.filter(o=>o.status===st.key).length }));
  document.querySelector("[data-status-bar]").innerHTML = counts.map(c=>{ const pct=(c.count/totalOrders)*100; return pct ? `<div class="seg" style="width:${pct}%;background:${c.color}" title="${c.label}: ${c.count}"></div>` : ''; }).join("");
  document.querySelector("[data-status-legend]").innerHTML = counts.map(c=>`<span class="legend-item"><span class="legend-dot" style="background:${c.color}"></span>${c.label} <b>${c.count}</b></span>`).join("");
})();
</script>
</body>
</html>
