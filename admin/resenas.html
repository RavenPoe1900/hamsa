<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="adm.rev.title">Reseñas — Admin Electro Hogar</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="../assets/i18n.js"></script>
<link rel="stylesheet" href="../assets/admin.css">
</style>
</head>
<body>
<script src="../assets/products-data.js"></script>
<script src="../assets/i18n-catalog.js"></script>
<script src="../assets/data.js"></script>
<script>if(!(window.VDB.currentUser()&&window.VDB.currentUser().role==='admin')){ location.href = window.VDB.currentUser() ? "../cuenta.html" : "../login.html?next=" + encodeURIComponent(location.pathname); }</script>
<script src="../assets/app.js"></script>
<script src="../assets/admin.js"></script>
<script>
(function(){
  const T = VI18N.t.bind(VI18N);
  const content = VADMIN.mountAdmin("resenas.html", T("adm.nav.reviews"), T("adm.rev.sub"));
  content.innerHTML = `
    <div class="toolbar"><select class="input" data-filter><option value="">${T("adm.rev.all")}</option><option value="approved">${T("adm.rev.approved")}</option><option value="rejected">${T("adm.rev.hiddenF")}</option></select></div>
    <div class="table-wrap"><table class="data-table"><thead><tr><th>${T("adm.th.product")}</th><th>${T("adm.th.customer")}</th><th>${T("adm.th.rating")}</th><th>${T("adm.th.review")}</th><th>${T("adm.th.status")}</th><th></th></tr></thead><tbody data-rows></tbody></table></div>`;
  function render(){
    const filter = document.querySelector("[data-filter]").value;
    const list = VDB.db.reviews.filter(r=> !filter || r.status===filter);
    document.querySelector("[data-rows]").innerHTML = list.map(r=>{
      const p = VDB.getProduct(r.productId);
      return `<tr data-review-row="${r.id}"><td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p?VUI.esc(VDB.pTitle(p)):T("adm.rev.deleted")}</td><td>${VUI.esc(r.userName)}</td><td>${r.rating}</td>
        <td style="max-width:280px;">${VUI.esc(r.body)}</td><td><span class="status-pill ${r.status==='approved'?'status-delivered':'status-cancelled'}">${r.status==='approved'?T("adm.rev.isApproved"):T("adm.rev.isHidden")}</span></td>
        <td class="row-actions">${r.status==='approved'?`<button data-hide="${r.id}">${T("adm.rev.hide")}</button>`:`<button data-approve="${r.id}">${T("adm.rev.approve")}</button>`}<button class="danger" data-delete-review="${r.id}">${T("acct.delete")}</button></td></tr>`;
    }).join("") || `<tr><td colspan="6" style="text-align:center;color:var(--muted-fg);padding:32px;">${T("adm.rev.none")}</td></tr>`;
    document.querySelectorAll("[data-hide]").forEach(b=>b.addEventListener("click",()=>{ VDB.setReviewStatus(b.dataset.hide,"rejected"); render(); }));
    document.querySelectorAll("[data-approve]").forEach(b=>b.addEventListener("click",()=>{ VDB.setReviewStatus(b.dataset.approve,"approved"); render(); }));
    document.querySelectorAll("[data-delete-review]").forEach(b=>b.addEventListener("click",()=>{ if(!confirm(T("adm.confirmDelReview"))) return; VDB.deleteReview(b.dataset.deleteReview); render(); }));
  }
  render();
  document.querySelector("[data-filter]").addEventListener("change", render);
})();
</script>
</body>
</html>
