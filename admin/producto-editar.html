<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="adm.pe.titleEdit">Editar producto — Admin Electro Hogar</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="../assets/i18n.js"></script>
<link rel="stylesheet" href="../assets/admin.css">
<style>.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; max-width:680px; } .form-grid .field.full{ grid-column:1/-1; } .preview-box{ width:110px; height:110px; display:grid; place-items:center; font-size:42px; margin-bottom:18px; border:1px solid var(--border); }.cart-thumb,.mini-thumb,.pdp-gallery,.preview-box,.thumb-cell,.low-stock-row .thumb-cell{border-radius:var(--radius);}
.check-circle{border-radius:50%;}

</style>
</head>
<body>
<script src="../assets/products-data.js"></script>
<script src="../assets/i18n-catalog.js"></script>
<script src="../assets/data.js"></script>
<script>if(!(window.VDB.currentUser()&&window.VDB.currentUser().role==='admin')){ location.href = window.VDB.currentUser() ? "../cuenta.html" : "../login.html?next=" + encodeURIComponent(location.pathname); }</script>
<script src="../assets/app.js"></script>
<script src="../assets/admin.js"></script>
<script>
(function(){
  const id = new URLSearchParams(location.search).get("id");
  const editing = id ? VDB.getProduct(id) : null;
  const T = VI18N.t.bind(VI18N);
  const content = VADMIN.mountAdmin("productos.html", editing?T("adm.pe.edit"):T("adm.pe.new"), editing?editing.title:T("adm.pe.newSub"));
  const cat0 = editing ? editing.category : VDB.CATEGORIES[0].id;
  const def0 = VDB.CATEGORIES.find(c=>c.id===cat0);
  content.innerHTML = `
    <div class="preview-box" data-preview style="background:${def0.hue[0]}22;color:${def0.hue[0]}">${def0.emoji}</div>
    <form id="pform" class="form-grid">
      <div class="field full"><label for="title">${T("adm.pe.name")}</label><input class="input" id="title" required value="${editing?VUI.esc(editing.title):''}"><span class="error">${T("adm.pe.errName")}</span></div>
      <div class="field"><label for="brand">${T("adm.pe.brand")}</label><input class="input" id="brand" value="${editing?VUI.esc(editing.brand):''}" placeholder="${T("adm.pe.generic")}"></div>
      <div class="field"><label for="category">${T("adm.th.category")}</label><select class="input" id="category">${VDB.CATEGORIES.map(c=>`<option value="${c.id}" ${cat0===c.id?'selected':''}>${c.name}</option>`).join("")}</select></div>
      <div class="field"><label for="price">${T("adm.pe.price",{c:VDB.db.settings.currency})}</label><input class="input" id="price" type="number" step="0.01" min="0" required value="${editing?editing.price:''}"><span class="error">${T("adm.pe.errPrice")}</span></div>
      <div class="field"><label for="oldPrice">${T("adm.pe.oldPrice")}</label><input class="input" id="oldPrice" type="number" step="0.01" min="0" value="${editing&&editing.oldPrice?editing.oldPrice:''}"></div>
      <div class="field"><label for="stock">${T("adm.th.stock")}</label><input class="input" id="stock" type="number" min="0" required value="${editing?editing.stock:20}"></div>
      <div class="field"><label class="checkbox-row" style="margin-top:10px;"><input type="checkbox" id="prime" ${editing&&editing.prime?'checked':''}> ${T("filter.delivery24")}</label></div>
      <div class="field full"><label for="description">${T("pdp.tabDesc")}</label><textarea class="input" id="description">${editing?VUI.esc(editing.description):''}</textarea></div>
      <div class="field full" style="display:flex;gap:10px;"><button class="btn btn-primary" type="submit">${editing?T("acct.saveChanges"):T("adm.pe.create")}</button><a class="btn btn-outline" href="productos.html">${T("acct.cancel")}</a></div>
    </form>`;
  const preview = document.querySelector("[data-preview]");
  document.getElementById("category").addEventListener("change",(e)=>{ const def=VDB.CATEGORIES.find(c=>c.id===e.target.value); preview.style.background=def.hue[0]+"22"; preview.style.color=def.hue[0]; preview.textContent=def.emoji; });
  document.getElementById("pform").addEventListener("submit",(e)=>{
    e.preventDefault(); const form=e.target; let ok=true;
    form.querySelectorAll(".input[required]").forEach(i=>{ const v=i.checkValidity(); i.closest(".field").classList.toggle("has-error", !v); if(!v) ok=false; });
    if(!ok) return;
    const data = { title:document.getElementById("title").value.trim(), brand:document.getElementById("brand").value.trim()||T("adm.pe.generic"), category:document.getElementById("category").value,
      price:Number(document.getElementById("price").value), oldPrice:document.getElementById("oldPrice").value?Number(document.getElementById("oldPrice").value):null,
      stock:Number(document.getElementById("stock").value), prime:document.getElementById("prime").checked, description:document.getElementById("description").value.trim() };
    if(editing) VDB.updateProduct(editing.id, data); else VDB.createProduct(data);
    VUI.toast(editing?T("adm.pe.updated"):T("adm.pe.created")); location.href="productos.html";
  });
})();
</script>
</body>
</html>
