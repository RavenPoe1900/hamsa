<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editar producto — Admin Electro Hogar</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/admin.css">
<script src="../assets/i18n.js"></script>
<script src="../assets/i18n-negocio.js"></script>
<style>
  .pe-layout{ display:grid; grid-template-columns:220px 1fr; gap:20px; align-items:start; max-width:920px; }
  .pe-photo{ display:flex; flex-direction:column; gap:10px; padding:18px; }
  .pe-photo-preview{ width:100%; aspect-ratio:1; border-radius:var(--radius); overflow:hidden; display:grid; place-items:center; font-size:52px; border:1px solid var(--border); }
  .pe-photo-preview img{ width:100%; height:100%; object-fit:cover; }
  .pe-photo .hint{ font-size:11.5px; color:var(--muted-fg); text-align:center; margin:0; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; padding:20px; }
  .form-grid .field.full{ grid-column:1/-1; }
  @media (max-width:640px){ .pe-layout{ grid-template-columns:1fr; } .form-grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<script src="../assets/products-data.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/negocio-demo.js"></script>
<script src="../assets/negocio.js"></script>
<script>if(!(window.VDB.currentUser()&&window.VDB.currentUser().role==='admin')){ location.href = window.VDB.currentUser() ? "../cuenta.html" : "../login.html?next=" + encodeURIComponent(location.pathname); }</script>
<script src="../assets/app.js"></script>
<script src="../assets/admin.js"></script>
<script>
(function(){
  const t = VI18N.t;
  const id = new URLSearchParams(location.search).get("id");
  const editing = id ? VDB.getProduct(id) : null;
  document.title = t(editing?"adm.pe.titleEdit":"adm.pe.new");
  const content = VADMIN.mountAdmin("productos.html", editing?t("adm.pe.edit"):t("adm.pe.new"), editing?editing.title:t("adm.pe.newSub"));
  const cat0 = editing ? editing.category : VDB.CATEGORIES[0].id;
  const def0 = VDB.CATEGORIES.find(c=>c.id===cat0);
  content.innerHTML = `
    <div class="pe-layout">
      <div class="pe-photo card">
        <div class="pe-photo-preview" data-preview style="background:${def0.hue[0]}22;color:${def0.hue[0]}">${editing&&editing.image?`<img src="${VUI.esc(editing.image)}" alt="">`:def0.emoji}</div>
        <input type="file" id="imageFile" accept="image/*" hidden>
        <label class="btn btn-outline btn-sm btn-block" for="imageFile">${VUI.icon('plus')} ${t('adm.pe.upload')}</label>
        <button type="button" class="btn btn-ghost btn-sm btn-block" data-remove-photo ${editing&&editing.image?'':'hidden'}>${VUI.icon('trash')} ${t('adm.pe.remove')}</button>
        <p class="hint">${t('adm.pe.photoHint')}</p>
      </div>
      <form id="pform" class="form-grid card">
        <div class="field full"><label for="title">${t('adm.pe.name')}</label><input class="input" id="title" required value="${editing?VUI.esc(editing.title):''}"><span class="error">${t('adm.pe.errName')}</span></div>
        <div class="field"><label for="brand">${t('adm.pe.brand')}</label><input class="input" id="brand" value="${editing?VUI.esc(editing.brand):''}" placeholder="${t('adm.pe.generic')}"></div>
        <div class="field"><label for="category">${t('adm.th.category')}</label><select class="input" id="category">${VDB.CATEGORIES.map(c=>`<option value="${c.id}" ${cat0===c.id?'selected':''}>${VI18N.cat(c.id,c.name)}</option>`).join("")}</select></div>
        <div class="field"><label for="price">${t('adm.pe.price',{c:VDB.db.settings.currency})}</label><input class="input" id="price" type="number" step="0.01" min="0" required value="${editing?editing.price:''}"><span class="error">${t('adm.pe.errPrice')}</span></div>
        <div class="field"><label for="oldPrice">${t('adm.pe.oldPrice')}</label><input class="input" id="oldPrice" type="number" step="0.01" min="0" value="${editing&&editing.oldPrice?editing.oldPrice:''}"></div>
        <div class="field"><label for="cost">${t('reo.th.cost')}</label><input class="input" id="cost" type="number" step="0.01" min="0" value="${editing&&editing.cost!=null?editing.cost:''}"><span class="hint">${t('pe.costHint')}</span></div>
        <div class="field"><label for="stock">${t('adm.th.stock')}</label><input class="input" id="stock" type="number" min="0" required value="${editing?editing.stock:20}"></div>
        <div class="field"><label class="checkbox-row" style="margin-top:10px;"><input type="checkbox" id="prime" ${editing&&editing.prime?'checked':''}> ${t('card.delivery24')}</label></div>
        <div class="field full"><label for="description">${t('pdp.tabDesc')}</label><textarea class="input" id="description">${editing?VUI.esc(editing.description):''}</textarea></div>
        <div class="field full" style="display:flex;gap:10px;"><button class="btn btn-primary" type="submit">${VUI.icon('check')} ${editing?t('acct.saveChanges'):t('adm.pe.create')}</button><a class="btn btn-outline" href="productos.html">${t('acct.cancel')}</a></div>
      </form>
    </div>`;
  const preview = document.querySelector("[data-preview]"), removeBtn = document.querySelector("[data-remove-photo]");
  let currentImage = editing && editing.image ? editing.image : null;
  function renderPreview(){
    if(currentImage){ preview.style.background="transparent"; preview.style.color=""; preview.innerHTML = `<img src="${currentImage}" alt="">`; removeBtn.hidden=false; }
    else{ const def=VDB.CATEGORIES.find(c=>c.id===document.getElementById("category").value); preview.style.background=def.hue[0]+"22"; preview.style.color=def.hue[0]; preview.textContent=def.emoji; removeBtn.hidden=true; }
  }
  document.getElementById("category").addEventListener("change",()=>{ if(!currentImage) renderPreview(); });
  document.getElementById("imageFile").addEventListener("change",(e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxSide = 640, scale = Math.min(1, maxSide/Math.max(img.width, img.height));
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement("canvas"); canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        currentImage = canvas.toDataURL("image/jpeg", 0.82);
        renderPreview();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
  removeBtn.addEventListener("click",()=>{ currentImage=null; document.getElementById("imageFile").value=""; renderPreview(); });
  document.getElementById("pform").addEventListener("submit",(e)=>{
    e.preventDefault(); const form=e.target; let ok=true;
    form.querySelectorAll(".input[required]").forEach(i=>{ const v=i.checkValidity(); i.closest(".field").classList.toggle("has-error", !v); if(!v) ok=false; });
    if(!ok) return;
    const data = { title:document.getElementById("title").value.trim(), brand:document.getElementById("brand").value.trim()||t('adm.pe.generic'), category:document.getElementById("category").value,
      price:Number(document.getElementById("price").value), oldPrice:document.getElementById("oldPrice").value?Number(document.getElementById("oldPrice").value):null,
      cost:document.getElementById("cost").value===""?null:Number(document.getElementById("cost").value), stock:Number(document.getElementById("stock").value), prime:document.getElementById("prime").checked, description:document.getElementById("description").value.trim(), image:currentImage };
    if(editing) VDB.updateProduct(editing.id, data); else VDB.createProduct(data);
    VUI.toast(editing?t('adm.pe.updated'):t('adm.pe.created')); location.href="productos.html";
  });
})();
</script>
</body>
</html>
