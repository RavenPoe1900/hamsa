<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="adm.usr.title">Usuarios — Admin Electro Hogar</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="../assets/i18n.js"></script>
<link rel="stylesheet" href="../assets/admin.css">
<style>.role-select{ min-height:32px; padding:4px 8px; font-size:12px; border:1px solid var(--border); border-radius:calc(var(--radius) - 2px); font-family:inherit; }.cart-thumb,.mini-thumb,.pdp-gallery,.preview-box,.thumb-cell,.low-stock-row .thumb-cell{border-radius:var(--radius);}
.check-circle{border-radius:50%;}

</style>
</head>
<body>
<script src="../assets/products-data.js"></script>
<script src="../assets/i18n-catalog.js"></script>
<script src="../assets/data.js"></script>
<script>if(!(window.VDB.currentUser()&&window.VDB.currentUser().role==='admin')){ location.href = window.VDB.currentUser() ? "../cuenta.html" : "../login.html?next=" + encodeURIComponent(location.pathname); }</script>
<script src="../assets/app.js"></script>
<script src="../assets/admin.js"></script>
<script>
(function(){
  const me = VDB.currentUser();
  const T = VI18N.t.bind(VI18N);
  const content = VADMIN.mountAdmin("usuarios.html", T("adm.nav.users"), T("adm.usr.sub"));
  content.innerHTML = `
    <div class="toolbar"><input class="input" type="search" placeholder="${T("adm.usr.searchPh")}" data-search style="min-width:280px;"></div>
    <div class="table-wrap"><table class="data-table"><thead><tr><th>${T("adm.th.name")}</th><th>${T("adm.th.email")}</th><th>${T("adm.th.role")}</th><th>${T("adm.th.joined")}</th><th>${T("adm.nav.orders")}</th><th></th></tr></thead><tbody data-rows></tbody></table></div>`;
  function render(){
    const q = document.querySelector("[data-search]").value.trim().toLowerCase();
    const list = VDB.db.users.filter(u=> !q || u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q));
    document.querySelector("[data-rows]").innerHTML = list.map(u=>`
      <tr data-user-row="${u.id}"><td>${VUI.esc(u.name)}</td><td>${VUI.esc(u.email)}</td>
        <td><select class="role-select" data-role-select ${u.id===me.id?'disabled':''}><option value="customer" ${u.role==='customer'?'selected':''}>${T("adm.role.customer")}</option><option value="admin" ${u.role==='admin'?'selected':''}>${T("adm.role.admin")}</option></select></td>
        <td>${VI18N.fmtDate(u.createdAt,{month:'short',year:'numeric'})}</td><td>${VDB.userOrders(u.id).length}</td>
        <td class="row-actions">${u.id===me.id?`<span class="mono-tag">${T("adm.you")}</span>`:`<button class="danger" data-delete-user="${u.id}">${T("acct.delete")}</button>`}</td></tr>`).join("") || `<tr><td colspan="6" style="text-align:center;color:var(--muted-fg);padding:32px;">${T("adm.noResults")}</td></tr>`;
    document.querySelectorAll("[data-role-select]").forEach(sel=>sel.addEventListener("change",(e)=>{ VDB.setUserRole(e.target.closest("tr").dataset.userRow, e.target.value); VUI.toast(T("adm.roleUpdated")); }));
    document.querySelectorAll("[data-delete-user]").forEach(b=>b.addEventListener("click",()=>{ if(!confirm(T("adm.confirmDelUser"))) return; VDB.deleteUser(b.dataset.deleteUser); VUI.toast(T("adm.userDeleted")); render(); }));
  }
  render();
  document.querySelector("[data-search]").addEventListener("input", render);
})();
</script>
</body>
</html>
