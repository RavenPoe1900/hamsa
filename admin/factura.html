<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factura — Admin Electro Hogar</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="../assets/i18n.js"></script>
<script src="../assets/i18n-negocio.js"></script>
<style>
  body{ background:var(--muted); }
  .inv-bar{ max-width:820px; margin:20px auto 12px; padding:0 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .inv-bar a{ font-size:13px; color:var(--muted-fg); }
  .sheet{ position:relative; max-width:820px; margin:0 auto 40px; background:#fff; color:#18181B; border:1px solid var(--border); border-radius:var(--radius); padding:40px 44px; font-size:13px; line-height:1.5; box-shadow:0 8px 30px -18px rgba(0,0,0,.35); }
  .inv-head{ display:flex; justify-content:space-between; gap:24px; align-items:flex-start; padding-bottom:22px; border-bottom:2px solid #18181B; }
  .biz h1{ font-size:20px; margin:0 0 4px; }
  .biz p{ margin:0; color:#52525B; }
  .doc{ text-align:end; }
  .doc .kind{ font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#52525B; }
  .doc .number{ font-size:22px; font-weight:800; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .doc p{ margin:2px 0 0; color:#52525B; }
  .parties{ display:grid; grid-template-columns:1fr 1fr; gap:24px; padding:20px 0; }
  .parties h2{ font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#71717A; margin:0 0 6px; }
  .parties p{ margin:0; }
  table.lines{ width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  table.lines th{ text-align:start; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:#71717A; padding:8px 6px; border-bottom:1px solid #D4D4D8; }
  table.lines td{ padding:9px 6px; border-bottom:1px solid #E4E4E7; vertical-align:top; }
  table.lines .n{ text-align:end; white-space:nowrap; }
  .totals{ margin-inline-start:auto; width:min(300px,100%); margin-top:14px; font-variant-numeric:tabular-nums; }
  .totals div{ display:flex; justify-content:space-between; padding:4px 6px; }
  .totals .grand{ border-top:2px solid #18181B; margin-top:6px; padding-top:9px; font-size:16px; font-weight:800; }
  .pay{ margin-top:22px; padding-top:14px; border-top:1px solid #E4E4E7; }
  .pay h2{ font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#71717A; margin:0 0 6px; }
  .pay p{ margin:2px 0; }
  .foot{ margin-top:26px; padding-top:14px; border-top:1px solid #E4E4E7; color:#52525B; font-size:12px; white-space:pre-wrap; }
  .stamp{ position:absolute; top:46%; inset-inline-start:50%; transform:translate(-50%,-50%) rotate(-14deg); font-size:64px; font-weight:800; letter-spacing:.1em; color:rgba(220,38,38,.16); border:6px solid rgba(220,38,38,.16); padding:0 22px; border-radius:10px; pointer-events:none; }
  html[dir="rtl"] .stamp{ transform:translate(50%,-50%) rotate(14deg); }
  @media (max-width:640px){ .sheet{ padding:24px 18px; } .parties{ grid-template-columns:1fr; } .inv-head{ flex-direction:column; } .doc{ text-align:start; } }
  @media print{
    body{ background:#fff; }
    .inv-bar{ display:none; }
    .sheet{ border:0; box-shadow:none; margin:0; padding:0; max-width:none; border-radius:0; }
    @page{ margin:16mm; }
  }
</style>
</head>
<body>
<script src="../assets/products-data.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/negocio-demo.js"></script>
<script src="../assets/negocio.js"></script>
<script>if(!(window.VDB.currentUser()&&window.VDB.currentUser().role==='admin')){ location.href = window.VDB.currentUser() ? "../cuenta.html" : "../login.html?next=" + encodeURIComponent(location.pathname + location.search); }</script>
<script src="../assets/app.js"></script>
<script>
(function(){
  const t = VI18N.t, esc = VUI.esc;
  const fmt = ts => VI18N.fmtDate(ts,{day:"numeric",month:"long",year:"numeric"});
  const inv = VFIN.getInvoice(new URLSearchParams(location.search).get("id"));
  const isCredit = !!inv && inv.kind==="credit";
  // una nota de crédito resta: todos sus importes salen en negativo
  const money = n => (isCredit && n ? "−" : "") + VUI.money(Math.abs(n));
  document.title = inv ? inv.number+" — "+t(isCredit?"inv.creditDoc":"inv.doc") : t("inv.notFound");
  if(!inv){ document.body.insertAdjacentHTML("beforeend", `<div class="sheet"><p>${t("inv.notFound")}</p><p><a href="facturacion.html">${t("inv.back")}</a></p></div>`); return; }
  const b = VFIN.business(), s = VFIN.state(inv), order = inv.orderId && VDB.getOrder(inv.orderId);
  const orig = isCredit ? VFIN.getInvoice(inv.rectifies) : null, credits = isCredit ? [] : VFIN.creditsOf(inv);
  const line = (label, v) => v ? `<p>${label}: ${esc(v)}</p>` : "";
  const rows = inv.lines.map(l=>`<tr><td>${esc(l.desc)}</td><td class="n">${l.qty}</td><td class="n">${money(l.price)}</td><td class="n">${money(l.qty*l.price)}</td></tr>`).join("");
  let payments = "";
  if(isCredit) payments = (inv.refunds||[]).map(r=>`<p>${t("inv.refundedOn",{date:fmt(r.date), method:t("pay."+r.method), amount:VUI.money(r.amount)})}</p>`).join("");
  else if(inv.settledByOrder) payments = `<p>${t("inv.paidWithOrder",{id:esc(inv.orderId), method:t("pay.card")+(order&&order.paymentLast4?" •••• "+esc(order.paymentLast4):"")})}</p>`;
  else payments = inv.payments.map(p=>`<p>${fmt(p.date)} · ${t("pay."+p.method)} · ${money(p.amount)}</p>`).join("");
  const stamp = inv.status==="void" ? t("inv.st.void") : (!isCredit && s.state==="credited") ? t("inv.st.credited") : "";
  document.body.insertAdjacentHTML("beforeend", `
    <div class="inv-bar"><a href="facturacion.html">← ${t("inv.back")}</a><button class="btn btn-primary btn-sm" onclick="window.print()">${t("inv.print")}</button></div>
    <article class="sheet">
      ${stamp?`<div class="stamp" aria-hidden="true">${stamp}</div>`:""}
      <header class="inv-head">
        <div class="biz"><h1>${esc(b.legalName||VDB.db.settings.storeName)}</h1>${b.taxId?`<p>${t("bill.taxId")}: ${esc(b.taxId)}</p>`:""}${b.address?`<p>${esc(b.address)}</p>`:""}${[b.phone,b.email].filter(Boolean).map(esc).join(" · ")?`<p>${[b.phone,b.email].filter(Boolean).map(esc).join(" · ")}</p>`:""}</div>
        <div class="doc"><div class="kind">${t(isCredit?"inv.creditDoc":"inv.doc")}</div><div class="number">${esc(inv.number)}</div><p>${t("ar.issued")}: ${fmt(inv.issuedAt)}</p>${!isCredit && inv.dueAt>inv.issuedAt?`<p>${t("ar.due")}: ${fmt(inv.dueAt)}</p>`:""}</div>
      </header>
      <section class="parties">
        <div><h2>${t("inv.billTo")}</h2><p><b>${esc(inv.customer.name)}</b></p>${line(t("bill.taxId"),inv.customer.taxId)}${inv.customer.address?`<p>${esc(inv.customer.address)}</p>`:""}${inv.customer.email?`<p>${esc(inv.customer.email)}</p>`:""}</div>
        <div><h2>${t("inv.details")}</h2>${isCredit&&orig?`<p><b>${t("inv.rectifies",{number:esc(orig.number)})}</b></p>`:""}${inv.orderId?`<p>${t("adm.th.order")}: ${esc(inv.orderId)}</p>`:""}<p>${t("adm.th.status")}: ${t("inv.st."+s.state)}</p>
          ${credits.map(c=>`<p>${t("inv.rectifiedBy",{number:esc(c.number)})} · ${fmt(c.issuedAt)}</p>`).join("")}${inv.note && !(isCredit && inv.note==="cancel") ? `<p>${esc(inv.note)}</p>` : ""}${isCredit && inv.note==="cancel" ? `<p>${t("inv.cancelReason")}</p>` : ""}</div>
      </section>
      <table class="lines"><thead><tr><th>${t("bill.line.desc")}</th><th class="n">${t("bill.line.qty")}</th><th class="n">${t("inv.unit")}</th><th class="n">${t("bill.line.amount")}</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="totals">
        <div><span>${t("inv.subtotal")}</span><span>${money(inv.subtotal)}</span></div>
        ${inv.shipping?`<div><span>${t("res.shipping")}</span><span>${money(inv.shipping)}</span></div>`:""}
        <div><span>${t("inv.tax")}${inv.taxRate?` (${inv.taxRate}%)`:""}</span><span>${money(inv.tax)}</span></div>
        <div class="grand"><span>${t("sum.total")}</span><span>${money(inv.total)}</span></div>
        ${isCredit||inv.settledByOrder||inv.status==="void"||s.state==="credited"?"":`<div><span>${t("inv.paid")}</span><span>${money(s.paid)}</span></div><div><span>${t("bill.th.balance")}</span><span>${money(s.balance)}</span></div>`}
      </div>
      ${payments?`<section class="pay"><h2>${t(isCredit?"inv.refunds":"inv.payments")}</h2>${payments}</section>`:""}
      ${b.footer?`<div class="foot">${esc(b.footer)}</div>`:""}
      <div class="foot" style="border:0;padding-top:0;margin-top:10px;">${t("inv.internalNote")}</div>
    </article>`);
})();
</script>
</body>
</html>
