<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="fav.title">Tus favoritos — Electro Hogar</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/i18n.js"></script>
<style>
  /* ---------- Cabecera de página ---------- */
  .fav-head{ padding:32px 0 26px; border-bottom:1px solid var(--border); margin-bottom:32px; }
  .fav-head .breadcrumbs{ margin-bottom:16px; }
  .fav-head .breadcrumbs .sep{ color:var(--border); }
  .fav-h1{ font-size:34px; letter-spacing:-.025em; line-height:1.05; }
  .fav-h1 .count{ display:inline-block; margin-inline-start:10px; font-family:var(--font-ui); font-weight:600; font-size:17px; letter-spacing:0; color:var(--muted-fg); }

  /* ---------- Grid de favoritos ---------- */
  .fav-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));
    gap:18px;
    margin-bottom:48px;
  }

  /* ---------- Tarjeta: sombra y hover ---------- */
  .fav-grid .product-card{
    box-shadow:0 2px 10px -4px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.05);
    transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .fav-grid .product-card:hover{
    border-color:var(--ring);
    box-shadow:0 8px 24px -8px rgba(0,0,0,.15), 0 2px 6px rgba(0,0,0,.06);
    transform:translateY(-2px);
  }

  /* ---------- Botón de favorito: más grande y con hover claro ---------- */
  .fav-grid .wish-btn{
    width:34px;
    height:34px;
    top:10px;
    inset-inline-end:10px;
    background:var(--card);
    border:1.5px solid var(--destructive);
    color:var(--destructive);
    transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .fav-grid .wish-btn .ic{
    width:18px;
    height:18px;
  }
  .fav-grid .wish-btn:hover{
    background:var(--destructive-tint);
    transform:scale(1.15);
    box-shadow:0 3px 10px -3px rgba(220,38,38,.35);
  }
  .fav-grid .wish-btn:active{
    transform:scale(.95);
  }

  /* ---------- Precio: alineación de decimales ---------- */
  .fav-grid .price small{
    font-size:14px;
    font-weight:700;
    vertical-align:baseline;
    letter-spacing:-.01em;
  }

  /* ---------- Botón de compra con elevación ---------- */
  .fav-grid .btn-buy:hover:not([disabled]){
    transform:translateY(-2px);
    box-shadow:0 8px 18px -5px color-mix(in srgb, var(--accent) 55%, transparent);
  }

  /* ---------- Estado vacío mejorado ---------- */
  .fav-empty{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    padding:80px 24px 60px;
    text-align:center;
  }
  .fav-empty-icon{
    width:72px;
    height:72px;
    border-radius:999px;
    background:var(--destructive-tint);
    display:grid;
    place-items:center;
    color:var(--destructive);
  }
  .fav-empty-icon svg{ width:34px; height:34px; }
  .fav-empty h2{ font-size:22px; letter-spacing:-.015em; margin:0; }
  .fav-empty p{ color:var(--muted-fg); max-width:340px; font-size:14px; margin:0; line-height:1.55; }

  /* ---------- Responsive ---------- */
  @media (max-width:600px){
    .fav-h1{ font-size:26px; }
    .fav-h1 .count{ display:block; margin:6px 0 0; }
    .fav-grid{ grid-template-columns:repeat(2,1fr); gap:12px; }
  }
  @media (max-width:380px){
    .fav-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div data-header-mount></div>
<main id="main" class="page container">
  <div class="fav-head">
    <nav class="breadcrumbs"><a href="index.html" data-i18n="crumb.home">Inicio</a><span class="sep">›</span><span data-i18n="nav.favorites">Favoritos</span></nav>
    <h1 class="fav-h1"><span data-i18n="fav.h1">Tus favoritos</span><span class="count" id="favCount"></span></h1>
  </div>
  <div class="fav-grid" id="favGrid" hidden></div>
  <div class="fav-empty" id="favEmpty" hidden>
    <div class="fav-empty-icon">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
        <path d="M12 20.5s-7.6-4.6-10-9.4C.5 7.6 2.3 4 6 4c2.1 0 3.7 1.2 6 3.6C14.3 5.2 15.9 4 18 4c3.7 0 5.5 3.6 4 7.1-2.4 4.8-10 9.4-10 9.4z"/>
      </svg>
    </div>
    <h2 data-i18n="fav.emptyTitle">Aún no has guardado nada</h2>
    <p data-i18n="fav.emptyMsg">Toca el corazón en cualquier producto para guardarlo aquí y encontrarlo rápido cuando lo necesites.</p>
    <a class="btn btn-primary" href="buscar.html" data-i18n="fav.browse">Explorar catálogo</a>
  </div>
</main>
<div data-footer-mount></div>
<script src="assets/products-data.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  VUI.mountChrome();
  const user = VUI.requireAuth(); if(!user) return;

  const grid   = document.getElementById("favGrid");
  const empty  = document.getElementById("favEmpty");
  const countEl= document.getElementById("favCount");

  function render(){
    const products = VDB.wishlistFor(user.id).map(id=>VDB.getProduct(id)).filter(Boolean);
    const n = products.length;
    countEl.textContent = n ? ` (${VI18N.fmtNum(n)})` : "";

    if(!n){ grid.hidden=true; empty.hidden=false; return; }

    grid.hidden  = false;
    empty.hidden = true;
    grid.innerHTML = products.map(p=>VUI.productCard(p)).join("");
  }

  // Listener único en el grid (delegación): el handler global de app.js llama
  // toggleWishlist() sincrónicamente primero; render() se ejecuta 120ms después,
  // cuando el estado ya está actualizado en VDB.
  grid.addEventListener("click", e=>{
    if(e.target.closest("[data-wish]")){
      setTimeout(render, 120);
    }
  });

  render();
})();
</script>
</body>
</html>
